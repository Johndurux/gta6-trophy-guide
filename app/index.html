<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Horizon — GTA VI trophy atlas and tracker</title>
<meta name="description" content="An offline guide, roadmap and tracker for the 55 PlayStation 5 trophies of Grand Theft Auto VI, with a cited guide for every trophy.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="horizon" aria-hidden="true">
  <span class="horizon-stars"></span>
  <span class="horizon-sun"></span>
  <span class="horizon-water"></span>
</div>

<header class="masthead">
  <div class="brand">
    <p class="brand-kicker">Leonida · PlayStation 5 · 55 trophies</p>
    <h1 class="brand-title">VICE<span>HORIZON</span></h1>
  </div>

  <section class="progress" aria-label="Platinum progress">
    <div class="progress-figures">
      <strong id="progress-count">0</strong>
      <span class="progress-total">/ 55 earned</span>
      <em id="progress-percent">0%</em>
    </div>
    <div class="progress-track" role="img" aria-label="Progress bar"><div class="progress-fill" id="progress-fill"></div></div>
    <ul class="progress-grades" id="progress-grades"></ul>
  </section>

  <div class="masthead-actions">
    <button id="spoiler-toggle" class="switch" type="button" aria-pressed="true" title="Hide or reveal the names of hidden trophies">
      <span class="switch-track"><span class="switch-dot"></span></span>
      <span class="switch-label">Spoilers <b id="spoiler-state">sealed</b></span>
    </button>
    <button id="export-progress" class="button button-primary" type="button">Export progress</button>
    <label class="button button-ghost" for="import-progress">Import
      <input id="import-progress" type="file" accept="application/json,.json">
    </label>
  </div>
</header>

<div class="toolbar">
  <nav class="views" aria-label="Views">
    <button class="view-tab is-active" type="button" data-view="checklist">Checklist</button>
    <button class="view-tab" type="button" data-view="roadmap">Roadmap</button>
    <button class="view-tab" type="button" data-view="missables">Missables</button>
  </nav>

  <section class="filters" id="filters" aria-label="Filter by kind">
    <div class="chips" id="kind-chips" role="group" aria-label="Filter by kind"></div>
    <label class="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="search" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
    </label>
  </section>
</div>

<main class="workspace" id="workspace">
  <section class="list-pane" id="list-pane" aria-label="Trophy checklist">
    <div class="list-head">
      <span id="list-title">All trophies</span>
      <label class="select">
        <select id="grade-filter" title="Filter by grade">
          <option value="all">All grades</option>
          <option value="platinum">Platinum</option>
          <option value="gold">Gold</option>
          <option value="silver">Silver</option>
          <option value="bronze">Bronze</option>
        </select>
      </label>
      <button id="hide-earned" class="list-toggle" type="button" aria-pressed="false">Hide earned</button>
      <span id="list-count">55 shown</span>
    </div>
    <div class="trophy-list" id="trophy-list" role="list"></div>
  </section>

  <aside class="detail-pane" id="detail-pane" aria-live="polite" aria-label="Trophy guide"></aside>
</main>

<section class="roadmap-pane" id="roadmap-pane" hidden aria-label="Roadmap to the platinum"></section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
